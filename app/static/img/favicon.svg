<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Icona della scheda (P42), disegnata da Claude: dorso rosso dietro, carta crema
       davanti con un denaro giallo. Colori di css/base/variables.css (red, red-strong,
       card-face, yellow, yellow-card). Copie PNG: favicon-32.png, apple-touch-icon.png.
       Nei commenti di un SVG non si può scrivere il doppio trattino. -->
  <g transform="rotate(-14 12 16)">
    <rect x="3" y="2" width="18" height="28" rx="3" fill="#d93636" stroke="#b02525" stroke-width="1.6"/>
  </g>
  <g transform="rotate(12 20 16)">
    <rect x="11" y="2" width="18" height="28" rx="3" fill="#fffaf0" stroke="#d93636" stroke-width="1.6"/>
    <circle cx="20" cy="16" r="5.2" fill="#ffc21a" stroke="#e9a000" stroke-width="1.4"/>
    <circle cx="20" cy="16" r="1.8" fill="#e9a000"/>
  </g>
</svg>
