<!doctype html>
<!--
  L'unica pagina HTML della SPA.
  React disegna tutto dentro <div id="root"> (src/main.tsx).
  In sviluppo la serve Vite (npm run dev); dopo npm run build la copia tradotta
  sta in app/static/dist/index.html e la serve Flask (app/blueprints/spa/).
  Niente script né stili scritti qui dentro: la CSP di Flask li bloccherebbe.

  La parte <head> è quella di tutte le pagine del sito (P19, P42, D40): icona della
  scheda, font del testo da Google Fonts (le sole risorse esterne, elencate in
  docs/prototipo/LEGGIMI.md e permesse dalla CSP), font delle icone del progetto e i
  CSS, presi da /static/ così come sono (Vite non li tocca). Le pagine di errore
  (app/templates/base.html) hanno icona, font e avviso "Gira il telefono" uguali a
  questi: se cambiano qui, vanno cambiati anche lì.
  Si caricano i CSS di tutte le pagine, quindi ognuno ha solo classi sue: accesso e
  registrazione (auth.css, che tocca .page--form solo se contiene .auth),
  impostazioni (profile.css), home (home.css, con lo sfondo di card-background.css,
  la carta-modal di mode-modal.css e la coda di queue-overlay.css) e tavolo (carte,
  mano, tavolo, presa, punteggio, anello del tempo, riepilogo, frasi e game.css:
  .card, .hand, .table__..., .seat, ...; le regole generiche, come button.card, img
  e *, valgono solo dentro .page--game, che c'è solo al tavolo).
-->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cinquecento</title>

  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="preload" href="/static/fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/static/css/base/reset.css">

  <link rel="stylesheet" href="/static/css/pages/auth.css">

  <link rel="stylesheet" href="/static/css/components/card-background.css">

       app/templates/base.html): quando si vede lo decide css/components/rotate-notice.css -->
