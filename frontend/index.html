<!doctype html>
<!--
  L'unica pagina HTML della SPA (docs/MIGRAZIONE-FRONTEND.md).
  React disegna tutto dentro <div id="root"> (src/main.tsx).
  In sviluppo la serve Vite (npm run dev); dopo npm run build la copia tradotta
  sta in app/static/dist/index.html e la serve Flask (app/blueprints/spa/).
  Niente script né stili scritti qui dentro: la CSP di Flask li bloccherebbe.

  La parte <head> copia quella di app/templates/base.html (P19, P42, D40): icona
  della scheda, font del testo da Google Fonts (le sole risorse esterne, elencate in
  docs/prototipo/LEGGIMI.md e permesse dalla CSP), font delle icone del progetto e
  gli stessi CSS, presi da /static/ così come sono (Vite non li tocca). Se cambia
  base.html va cambiato anche qui, finché tutte le pagine non sono nella SPA.
  I CSS delle pagine (css/pages/) sono quelli delle pagine già nella SPA: accesso e
  registrazione (auth.css, che dal passo 6 tocca .page--form solo se contiene
  .auth), impostazioni (profile.css, solo classi sue) e home (home.css, dal
  passo 7: solo classi sue, .home e le sue parti, con lo sfondo di
  card-background.css, la carta-modal di mode-modal.css e la coda di
  queue-overlay.css, dal 7b).
  Dal passo 8 anche i CSS del tavolo (game/table.html): carte, mano, tavolo, presa,
  punteggio, anello del tempo, riepilogo, frasi e game.css. Hanno solo classi loro
  (.card, .hand, .table__..., .seat, ...); le regole generiche (button.card, img, *)
  valgono solo dentro .page--game, che c'è solo al tavolo.
-->
